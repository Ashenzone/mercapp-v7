<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pedidos · Mercapp</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Pedidos</h1>
        <div class="sub">Compras feitas pelos consumidores (bots) na sua loja.</div>
      </div>
    </div>
    <table>
      <thead><tr><th>Produto</th><th>Preco</th><th>Origem</th><th>Data</th></tr></thead>
      <tbody id="tabela"></tbody>
    </table>
  </main>
</div>

<script src="js/sidebar.js"></script>
<script src="js/app.js"></script>
<script>
async function carregar() {
  const companyId = await garantirEmpresa();
  const resp = await fetch(`${API}/orders/empresa/${companyId}`);
  const pedidos = await resp.json();
  document.getElementById('tabela').innerHTML = pedidos.length
    ? pedidos.map((p) => `
        <tr>
          <td>${p.product_name}</td>
          <td class="num-col">${formatarPreco(p.price_cents)}</td>
          <td>${p.source}</td>
          <td>${new Date(p.created_at).toLocaleString('pt-BR')}</td>
        </tr>`).join('')
    : '<tr><td colspan="4">Nenhum pedido ainda. Espere o ciclo de mercado rodar ou force um na pagina Tendencias.</td></tr>';
}
carregar();
</script>
</body>
</html>
