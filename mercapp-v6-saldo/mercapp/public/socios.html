<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Socios · Mercapp</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Socios</h1>
        <div class="sub">Convide outro jogador pra tocar a empresa com voce, ou peca sociedade em outra.</div>
      </div>
    </div>

    <div class="section-title">Pedir sociedade em outra empresa</div>
    <form id="form-pedir" class="form-grid" style="margin-bottom:24px;">
      <div class="field"><label>E-mail do dono</label><input name="email_alvo" type="email" required placeholder="socio@email.com"></div>
      <div class="field"><label>Participacao desejada (%)</label><input name="share_pct" type="number" min="1" max="49" value="25"></div>
      <div class="form-actions"><button class="btn" type="submit">Enviar pedido</button></div>
    </form>

    <div class="section-title">Pedidos recebidos na sua empresa</div>
    <div id="pedidos"></div>
  </main>
</div>

<script src="js/sidebar.js"></script>
<script src="js/app.js"></script>
<script>
async function responder(id, status) {
  const resp = await fetch(`${API}/rh/socios/${id}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status }),
  });
  if (resp.ok) { toast('Atualizado.'); carregar(); } else toast('Erro.');
}

async function carregar() {
  const companyId = await garantirEmpresa();
  const resp = await fetch(`${API}/rh/socios/${companyId}`);
  const lista = await resp.json();
  document.getElementById('pedidos').innerHTML = lista.length
    ? lista.map((s) => `
        <div class="list-row">
          <div><strong>${s.nickname}</strong><br><span class="stat">quer ${Number(s.share_pct).toFixed(0)}% · ${s.status}</span></div>
          ${s.status === 'pendente' ? `
            <div style="display:flex;gap:6px;">
              <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="responder('${s.id}','aceito')">Aceitar</button>
              <button class="btn danger" style="padding:6px 12px;font-size:12px;" onclick="responder('${s.id}','recusado')">Recusar</button>
            </div>` : `<span class="status-pill ${s.status === 'aceito' ? 'active' : 'paused'}">${s.status}</span>`}
        </div>`).join('')
    : '<div class="empty">Nenhum pedido de sociedade ainda.</div>';
}

document.getElementById('form-pedir').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target).entries());
  const emailLogado = getEmailAtual();
  const uResp = await fetch(`${API}/auth/login`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: emailLogado }),
  });
  const eu = await uResp.json();

  const resp = await fetch(`${API}/rh/socios/pedir`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: eu.id, email_alvo: fd.email_alvo, share_pct: Number(fd.share_pct) }),
  });
  const d = await resp.json();
  if (resp.ok) { toast('Pedido enviado!'); e.target.reset(); }
  else toast(d.erro || 'Erro ao enviar pedido.');
});

carregar();
</script>
</body>
</html>
