<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Trafego Pago · Mercapp</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Trafego Pago</h1>
        <div class="sub">Invista para dar exposicao aos seus produtos. Mais investimento nao garante vendas.</div>
      </div>
    </div>

    <form id="form-campanha" class="form-grid" style="margin-bottom:32px;">
      <div class="field full">
        <label>Produto</label>
        <select name="product_id" id="product_id" required></select>
      </div>
      <div class="field">
        <label>Orcamento (R$)</label>
        <input name="budget" type="number" step="0.01" min="1" required placeholder="200.00">
      </div>
      <div class="field">
        <label>Duracao (dias)</label>
        <input name="duration_days" type="number" min="1" value="7" required>
      </div>
      <div class="field">
        <label>Objetivo</label>
        <select name="objective">
          <option value="vendas">Vendas</option>
          <option value="visualizacoes">Visualizacoes</option>
          <option value="cliques">Cliques</option>
          <option value="reconhecimento">Reconhecimento</option>
        </select>
      </div>
      <div class="field">
        <label>Regiao</label>
        <input name="region" value="Brasil">
      </div>
      <div class="field full">
        <label>Publico (descricao livre)</label>
        <input name="audience" placeholder="Ex: iniciantes em programacao, 18-35 anos">
      </div>
      <div class="form-actions">
        <button class="btn" type="submit">Lancar campanha</button>
      </div>
    </form>

    <div class="section-title">Suas campanhas</div>
    <div id="lista"></div>
  </main>
</div>

<script src="js/sidebar.js"></script>
<script src="js/app.js"></script>
<script>
async function carregarProdutosSelect(companyId) {
  const resp = await fetch(`${API}/products/empresa/${companyId}`);
  const produtos = await resp.json();
  const sel = document.getElementById('product_id');
  if (produtos.length === 0) {
    sel.innerHTML = '<option value="">Voce ainda nao tem produtos</option>';
    return;
  }
  sel.innerHTML = produtos.map((p) => `<option value="${p.id}">${p.name}</option>`).join('');
}

function linhaCampanha(c) {
  const gasto = c.spent_cents / 100;
  const orcamento = c.budget_cents / 100;
  const ctr = c.impressions > 0 ? ((c.clicks / c.impressions) * 100).toFixed(1) : '0.0';
  return `
    <div class="card" style="margin-bottom:12px;">
      <div class="body">
        <div class="meta" style="border:none;padding:0;">
          <h3>${c.product_name}</h3>
          <span class="status-pill ${c.status === 'active' ? 'active' : c.status === 'finished' ? 'paused' : 'draft'}">${c.status}</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:${Math.min(100, (gasto / orcamento) * 100)}%"></div></div>
        <div class="stat">gasto ${formatarPreco(c.spent_cents)} de ${formatarPreco(c.budget_cents)}</div>
        <div style="display:flex;gap:18px;margin-top:10px;font-size:13px;">
          <span>Impressoes: <strong class="num">${c.impressions}</strong></span>
          <span>Cliques: <strong class="num">${c.clicks}</strong></span>
          <span>CTR: <strong class="num">${ctr}%</strong></span>
        </div>
        ${c.status === 'active' ? `<button class="btn secondary" style="margin-top:10px;padding:6px 10px;font-size:12px;" onclick="pausar('${c.id}')">Pausar</button>` : ''}
      </div>
    </div>`;
}

async function pausar(id) {
  await fetch(`${API}/campaigns/${id}/status`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'paused' }),
  });
  toast('Campanha pausada.');
  carregarCampanhas();
}

async function carregarCampanhas() {
  const companyId = await garantirEmpresa();
  const resp = await fetch(`${API}/campaigns/empresa/${companyId}`);
  const campanhas = await resp.json();
  const el = document.getElementById('lista');
  el.innerHTML = campanhas.length
    ? campanhas.map(linhaCampanha).join('')
    : '<div class="empty">Nenhuma campanha criada ainda.</div>';
}

document.getElementById('form-campanha').addEventListener('submit', async (e) => {
  e.preventDefault();
  const companyId = await garantirEmpresa();
  const fd = new FormData(e.target);
  const payload = Object.fromEntries(fd.entries());
  payload.company_id = companyId;

  const resp = await fetch(`${API}/campaigns`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
  });
  if (resp.ok) {
    toast('Campanha lancada.');
    e.target.reset();
    carregarCampanhas();
    atualizarSaldoSidebar();
  } else {
    const err = await resp.json();
    toast(err.erro || 'Erro ao lancar campanha.');
  }
});

(async () => {
  const companyId = await garantirEmpresa();
  await carregarProdutosSelect(companyId);
  await carregarCampanhas();
})();
</script>
</body>
</html>
